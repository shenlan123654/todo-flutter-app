name: qicheng_flutter
description: "便宜启程 Flutter 双端版：每日清单、提醒、统计、记事本与本地音乐。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: 2.1.5
  shared_preferences: 2.3.4
  intl: ^0.20.3
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  file_picker: ^13.3.2
  image_picker: ^1.2.4
  permission_handler: 12.0.3

dependency_overrides:
  path_provider_android: 2.2.15
  shared_preferences_android: 2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/launcher_icon_1024.png
  min_sdk_android: 23
  remove_alpha_ios: true
  background_color_ios: "#050B1A"
